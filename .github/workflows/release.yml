name: Release

# Push a version tag to build installers on both OSes and attach them to a
# GitHub Release. macOS is required to produce the .dmg — it can't be built on
# Windows, which is why the build runs on a matrix of runners.
#
# Two kinds of tag:
#   v0.2.0         -> a normal release. Becomes `releases/latest`, publishes
#                     `latest.yml`, and every installed app updates to it.
#   v0.2.0-beta.1  -> a PRERELEASE. Publishes `beta.yml`, is excluded from
#                     `releases/latest` by GitHub, and only reaches installs that
#                     opted into test builds. See docs/release-checklist.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # allow the workflow to create/upload the GitHub Release

jobs:
  # Nothing gets packaged until this passes. A tag that fails typecheck, lint or
  # tests must never turn into an installer that updates itself onto real
  # machines — this job is the whole point of the gate.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build renderer/main/preload
        run: npm run build

      # A tag containing "-" is a prerelease (v0.2.0-beta.1) and needs TWO things
      # set, both of which electron-builder gets wrong by default here:
      #
      # 1. releaseType=prerelease. Otherwise electron-builder.yml's
      #    `releaseType: release` makes the beta `releases/latest` and pushes a
      #    test build to every user and to the download page.
      #
      # 2. channel=beta. electron-builder deliberately does NOT infer the channel
      #    from the version for the GitHub provider (app-builder-lib
      #    updateInfoBuilder.js: "for GitHub should be pre-release way be used"),
      #    so without this it writes `latest.yml` even for 0.2.0-beta.1.
      #    electron-updater asks for `beta.yml` first and only falls back to
      #    `latest.yml` (GitHubProvider.js:133,139) — a channel shouldn't depend
      #    on an undocumented fallback, so name it explicitly.
      - name: Decide release type and channel
        id: kind
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"                 # 0.2.0-beta.1
          if [[ "$tag" == *-* ]]; then
            pre="${tag#*-}"                          # beta.1
            channel="${pre%%.*}"                     # beta
            echo "args=--config.publish.releaseType=prerelease --config.publish.channel=${channel}" >> "$GITHUB_OUTPUT"
            echo "what=prerelease -> ${channel}.yml" >> "$GITHUB_OUTPUT"
          else
            echo "args=--config.publish.releaseType=release" >> "$GITHUB_OUTPUT"
            echo "what=release -> latest.yml" >> "$GITHUB_OUTPUT"
          fi

      - name: Package installer & publish to the Release
        run: |
          echo "Publishing as: ${{ steps.kind.outputs.what }}"
          npx --no-install electron-builder --publish always ${{ steps.kind.outputs.args }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned MVP: don't let electron-builder try to find a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # electron-builder's GitHub publisher silently SKIPS uploading (exit 0, no
  # error) if the release it's publishing to was created more than 2 hours
  # ago — a guard against a stale/delayed CI run clobbering a release that's
  # moved on. That guard has no way to know "clobbering" isn't the risk here;
  # it just as happily protects a release that's incomplete because the OTHER
  # matrix job failed and got re-run hours later (found 2026-08-27: a Windows
  # re-run built Setup.exe/.blockmap/latest.yml perfectly and then logged
  # "skipped publishing ... reason=existing release published more than 2
  # hours ago" for all three — job green, nothing shipped). So "the build
  # jobs are green" is not evidence the release is complete; this job checks
  # the actual GitHub Release object instead.
  verify-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every expected asset actually uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "$version" == *-* ]]; then
            pre="${version#*-}"
            yml="${pre%%.*}.yml"
          else
            yml="latest.yml"
          fi
          expected=("Notealise-Setup.exe" "Notealise-Setup.exe.blockmap" "Notealise.dmg" "$yml")

          release_json=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "User-Agent: notes-app-release-verify" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${tag}")

          missing=0
          for name in "${expected[@]}"; do
            state=$(echo "$release_json" | python3 -c "import json,sys; d=json.load(sys.stdin); m=[a['state'] for a in d.get('assets',[]) if a['name']=='$name']; print(m[0] if m else 'MISSING')")
            echo "  $name -> $state"
            [ "$state" = "uploaded" ] || missing=1
          done

          if [ "$missing" = "1" ]; then
            echo "::error::Release ${tag} is missing one or more expected assets. If the build jobs above are green anyway, this is almost certainly electron-builder's >2h-old-release publish guard (see docs/release-checklist.md) — don't re-run this workflow, bump to a new patch version and tag that instead."
            exit 1
          fi
          echo "All expected assets are uploaded for ${tag}."
