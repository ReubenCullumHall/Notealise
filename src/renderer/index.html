<!doctype html>
<html lang="en" data-theme="dark" data-density="cozy" data-text-tone="grey" data-button-def="off">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notealise</title>
    <script>
      // The preload bridge exposes the cached theme synchronously as
      // window.mdnotesTheme (read from userData) BEFORE this script runs, so the
      // first paint is already the correct theme/density — no flash. The static
      // data-* on <html> above is the fallback if the cache is unavailable.
      (function () {
        try {
          var c = window.mdnotesTheme || {}
          var root = document.documentElement
          // A cached theme of 'system' names no ramp of its own — resolve it
          // against the OS preference first, same as settings/model.ts's
          // resolveTheme (kept in sync by hand: this script runs before any
          // module has loaded, so it can't import that function).
          var t = c.theme
          if (t === 'system') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          // allow-list, not a pass-through: an unknown id would leave <html>
          // with no matching ramp at all, painting an unstyled white flash.
          root.dataset.theme = t === 'light' || t === 'black' ? t : 'dark'
          root.dataset.density = c.density || 'cozy'
          root.dataset.textTone = c.textTone === 'white' ? 'white' : 'grey'
          root.dataset.buttonDef = c.buttonDefinition === true ? 'on' : 'off'
        } catch (e) {
          /* keep the static dark/cozy fallback */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
