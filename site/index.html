<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notealise — Download</title>
  <meta name="description" content="Download Notealise for Windows and macOS." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script>
    // Sets html.wm-motion before any body markup is parsed, so the wordmark's hidden-until-
    // animated CSS (below, and in the generated block) can gate on a plain class instead of
    // @media (prefers-reduced-motion: no-preference). A media query alone can race first paint
    // in real Safari — matching a system accessibility setting isn't guaranteed resolved by the
    // very first style pass, so the base (visible, finished-word) rule can paint for a frame
    // before the query's hiding rule lands: the word flashes fully formed, then blanks, then
    // replays from the start. matchMedia() here runs synchronously before <body> exists at all,
    // so there is nothing left to race. No JS, or an old browser without matchMedia, means the
    // class is never added and the page shows the plain finished word — same safe fallback as
    // before.
    if (window.matchMedia && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("wm-motion");
    }
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --ink: oklch(24% 0.02 50);
      --muted: oklch(24% 0.02 50 / 0.5);
      --line: oklch(24% 0.02 50 / 0.16);
      --footer-h: 64px;
    }
    * { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
    }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top-left mark. No banner, no nav. ───────────────────────────── */
    .mark {
      position: fixed; top: 24px; left: 24px; z-index: 10;
      width: 34px; height: 34px; border-radius: 50%; display: block;
    }

    /* ── Hero: the wordmark, big, near the top. ──────────────────────── */
    .hero {
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding-top: clamp(96px, 18vh, 220px);
      text-align: center;
    }
    .wordmark {
      margin: 0; font-size: clamp(3.2rem, 11vw, 8.5rem); font-weight: 700;
      letter-spacing: -0.03em; line-height: 1; display: inline-flex; align-items: baseline;
    }
    /* "alise" — traced from PetitFormalScript, not rendered as live text (see
       DESIGN.md: "the load-in animation" for why). The <path> data below is
       real glyph outlines extracted once via opentype.js, so the font file
       itself is no longer shipped — nothing here depends on it loading. */
    .wm-note-wrap { position: relative; display: inline-block; }
    .wm-note { display: inline-block; }
    .wm-caret {
      position: absolute; top: 0.06em; bottom: 0.08em; left: 100%;
      width: 0.05em; background: var(--ink); opacity: 0;
    }
    /* THE "t" CROSSBAR PATCH IS GONE (2026-08-13), and must not come back without a fresh
       measurement. It painted var(--bg) over 59.4–60.8% of the wordmark during the "o"
       phase, to hide a sliver of the t's crossbar that used to poke left of the reveal
       edge. Re-measured on the current build, with the caret and the patch both hidden:

           o spans 36.13% – 60.53%      t starts at 61.73%      reveal edge is 60.76%

       The crossbar now starts a full point to the RIGHT of the reveal edge, so there is
       no sliver to cover - and the patch was instead painting over the right-hand edge of
       the "o", which is the bite Reuben spotted. A cover-up that outlives the thing it
       covered is worse than the original bug: it hides real ink. If a sliver ever returns,
       measure the three numbers above again and cover only the gap between them. */
    /* 93%, and raised so its lowest ink lands on the same line as Note's — the two halves
       have to read as one word. The raise is `top`, and it has to be: .wordmark is
       inline-flex, so this is a FLEX ITEM, and vertical-align does not apply to flex items
       at all (nor does margin-bottom shift one, since a flex item's baseline is synthesised
       from its border box). A vertical-align nudge sat here inertly until 2026-08-12. The
       value is generated — edit gen_pen.py's INK_DROP/OVERSHOOT, not this line. */
    .wm-alise-svg { display: inline-block; margin-left: 0.06em; overflow: visible;
      position: relative; top: -0.03557em; }
    /* fill + a 190 stroke: the stroke is what gives the wordmark its weight. Dropping
       it (briefly, 2026-08-10) rendered the raw glyph fill alone and read as far too
       thin — this is the bolder original and it stays. Any reveal mask has to be sized
       against THIS shape, fill+stroke, not the fill on its own. */
    .wm-letter {
      fill: var(--ink); fill-opacity: 1;
      stroke: var(--ink); stroke-width: 190; stroke-linecap: round; stroke-linejoin: round;
      stroke-opacity: 1;
    }
    .wm-pen-dot { offset-rotate: 0deg; opacity: 0; fill: var(--ink); }
    /* THE REVEAL LIVES IN THE GENERATED BLOCK BELOW, not here. Each letter is cut into
       ~44 slices of the pen's journey and each slice is a clipped copy of the glyph that
       switches on as the pen reaches it, so the only edges on screen are the letter's own
       outline and one clean cut across the stroke. See site/DESIGN.md, tenth pass, sixth
       addendum.

       There is deliberately NO reveal stroke here any more. Until 2026-08-12 this was a
       thick stroke swept along the centerline and grown with stroke-dashoffset, and every
       artefact reported that weekend came from that one choice: what a viewer saw
       mid-stroke was the edge of the DISC, not the edge of the letter. It scalloped where
       the disc was narrower than the stroke, cusped wherever the path turned inside one
       disc radius, and its cap left either a flat chord (butt) or a full disc dumped at
       each letter's start (round — the "splot"). Ownership bands were added to contain one
       symptom and could not touch the others. Do not reintroduce a swept stroke to "smooth"
       anything; it is the thing that was removed. */

    /* The load-in: types "Note" (caret vanishes the instant typing ends, no
       lingering blink), then draws "alise" letter by letter as solid ink growing
       along its centerline behind a small pen-tip dot — never a hollow/thin
       intermediate state. Static final state above is the no-motion fallback,
       and is also exactly what the animation settles into. Letters are NOT
       bridged with connecting strokes (tried once, removed by decision — see
       DESIGN.md). */
    /* Gated on html.wm-motion (set by a synchronous head script), not a bare
       @media (prefers-reduced-motion: no-preference) — see that script's comment for why a
       media query alone let the finished word flash on first paint in real Safari. */
    html.wm-motion .wm-note { clip-path: inset(0 100% 0 0); animation: note-type 600ms steps(1, jump-end) 250ms both; }
    html.wm-motion .wm-caret {
      animation: caret-life 600ms steps(1, jump-end) 250ms both,
                 caret-move 600ms steps(1, jump-end) 250ms both;
    }
    /* The slices' own switch-on rules are generated (they carry a per-slice delay off
       the pen's pacing curve) and sit in the keyframes block below. */
    html.wm-motion .wm-pen-dot { animation: pen-move var(--penDur) linear var(--penDelay) forwards; }
    /* THE STOPS SIT IN THE GAPS BETWEEN THE LETTERS' INK, NOT ON THEIR ADVANCE WIDTHS.
       A character's advance box is not its ink box: `t` is drawn with its crossbar reaching
       back past where the glyph's box starts, so cutting at the o/t advance boundary (the
       60.76% this used to reveal) left a slice of that crossbar hanging in the air after
       "No" - a stray tick to the right of the o. The same thing happened one step later,
       where 77.03% showed the left edge of the `e`.

       MEASURED off the real render at 10x device scale, as ink columns rather than metrics:
         N 3.07-31.77 | o 34.45-59.36 | t 59.75-74.77 | e 75.83-99.89   (% of the element)
       so the gaps are 31.77-34.45, 59.36-59.75 and 74.77-75.83. Each stop below is the
       MIDPOINT of its gap, which is the only choice that both hides the next letter and
       leaves the previous one uncut - the o/t gap is 0.39% wide and an earlier attempt at
       this erred toward the o and shaved its edge. Re-measure if the font stack or weight
       ever changes; these are specific to this rendering of `Note`.

       The caret keeps its own stops (caret-move, below). It marks where the next glyph will
       land, which is the advance boundary, so it sits a hair to the right of the ink - that
       is what a text caret does. */
    @keyframes note-type {
      0%    { clip-path: inset(0 100%   0 0); }
      5.7%  { clip-path: inset(0 66.89% 0 0); }
      42.8% { clip-path: inset(0 66.89% 0 0); }
      48.5% { clip-path: inset(0 40.44% 0 0); }
      85.7% { clip-path: inset(0 40.44% 0 0); }
      91.4% { clip-path: inset(0 24.70% 0 0); }
      100%  { clip-path: inset(0 0%     0 0); }
    }
    /* Blink phases share note-type/caret-move's own breakpoints (5.7/48.5/91.4%), so the
       caret is always visible the instant a letter appears — never mid-blink-off, which
       was the old bug (a separate 850ms/0-delay clock could miss a letter's reveal by
       up to ~180ms and stayed invisible through "t" entirely). */
    @keyframes caret-life {
      0%           { opacity: 1; }
      4.5%         { opacity: 0; }
      5.7%, 24%    { opacity: 1; }
      28%, 47%     { opacity: 0; }
      48.5%, 67%   { opacity: 1; }
      71%, 90%     { opacity: 0; }
      91.4%        { opacity: 1; }
      100%         { opacity: 0; }
    }
    @keyframes caret-move {
      0%    { left: 0%; }
      5.7%  { left: 34.43%; }
      42.8% { left: 34.43%; }
      48.5% { left: 60.76%; }
      85.7% { left: 60.76%; }
      91.4% { left: 77.03%; }
      100%  { left: 100%; }
    }

    /* THE REVEAL. Each slice of a letter is a clipped copy of the glyph that is off
       until the pen reaches it and on from then on - that switch is the whole
       animation. `1ms` rather than `0s` because a zero-duration animation is not
       required to fire its fill, and `both` is what holds the 0% state through the
       delay so nothing is on the page before its turn.

       The hiding MUST sit behind the same html.wm-motion gate as the rest of the reveal
       (see the head script, and the .wm-note/.wm-caret/.wm-pen-dot rules above) rather than
       a bare @media (prefers-reduced-motion: no-preference). A media query alone races
       first paint in real Safari: matching a system accessibility setting isn't guaranteed
       resolved by the first style pass, so the base (visible) rule can paint for a frame
       before the query's hiding rule lands - a flash of the finished word right before it
       blanks and replays. `html.wm-motion` is set by a synchronous head script before any
       of this markup is parsed, so there is nothing left to race. Under reduced motion, or
       with JS off, the class is never added, so a bare `opacity: 0` here would leave the
       wordmark blank instead of showing the finished word - outside the gate they still
       default to visible, same as before. */
    @keyframes wm-settle { to { opacity: 1; } }
    html.wm-motion .wm-slice  { opacity: 0; animation: wm-settle 1ms linear var(--sliceAt) both; }
    html.wm-motion .wm-settle { opacity: 0; animation: wm-settle 1ms linear var(--settleAt) both; }
    /* wordmark-keyframes:end */

    .scroll-cue {
      margin-top: auto; margin-bottom: 40px;
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%;
      color: var(--muted); text-decoration: none;
      animation: bob 2.2s ease-in-out infinite;
    }
    .scroll-cue svg { width: 20px; height: 20px; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    /* ── Gap: reserved for content, added later. ─────────────────────── */
    .gap { min-height: 100dvh; }

    /* ── Download: simple, no extra copy. ────────────────────────────── */
    /* The footer sits directly under this, and the two together make one
       viewport — so jumping to #download lands the buttons centred with the
       bottom bar in view rather than one scroll short of it. */
    .download {
      min-height: calc(100dvh - var(--footer-h)); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      padding: 40px 20px;
    }
    .btns {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      width: min(560px, 100%);
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; text-decoration: none; font-weight: 600; font-size: 15px;
      padding: 15px 18px; border-radius: 12px; border: 1.5px solid var(--ink);
      color: var(--ink); background: transparent; transition: background .15s ease, color .15s ease;
    }
    .btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
    .btn.primary { background: var(--ink); color: var(--bg); }
    .btn.primary:hover { background: color-mix(in srgb, var(--ink) 88%, transparent); }
    .btn svg { width: 20px; height: 20px; flex: 0 0 auto; }
    .btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }

    .config-warn {
      margin: 0 0 4px; padding: 12px 14px; border-radius: 12px; font-size: 13px;
      border: 1px solid var(--line); color: var(--muted); width: min(560px, 100%);
    }
    .hidden { display: none; }

    /* ── Bottom bar. ─────────────────────────────────────────────────── */
    .footer {
      min-height: var(--footer-h);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px 24px; padding: 20px clamp(20px, 5vw, 48px);
      border-top: 1px solid var(--line);
      font-size: 13px; color: var(--muted);
    }
    .footer-brand { color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
    .footer-est { color: var(--muted); font-weight: 400; letter-spacing: 0.06em; }

    /* Too narrow for two side-by-side boxes without the labels wrapping. */
    @media (max-width: 480px) {
      /* The two footer lines stack here, so the reserved height has to grow
         with them or the bar spills past the fold. */
      :root { --footer-h: 92px; }
      .btns { grid-template-columns: 1fr; width: min(360px, 100%); }
      .config-warn { width: min(360px, 100%); }
      .footer { justify-content: center; text-align: center; }
    }
  </style>

        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.7 10.2 4.7v6.8H3V5.7zM10.2 12.5v6.8L3 18.3v-5.8h7.2zM11.2 4.55 21 3.2v8.3h-9.8V4.55zM21 12.5v8.3l-9.8-1.35V12.5H21z"/></svg>
        <span>Download for Windows</span>

      <a id="macBtn" class="btn" href="#" rel="nofollow">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.36 12.9c.02 2.5 2.19 3.33 2.22 3.34-.02.06-.35 1.2-1.15 2.37-.69 1.02-1.41 2.03-2.55 2.05-1.11.02-1.47-.66-2.75-.66-1.27 0-1.67.64-2.72.68-1.09.04-1.93-1.1-2.63-2.11-1.42-2.07-2.51-5.85-1.05-8.4.72-1.27 2.02-2.07 3.42-2.09 1.07-.02 2.08.72 2.75.72.66 0 1.9-.9 3.2-.76.54.02 2.07.22 3.05 1.66-.08.05-1.82 1.07-1.8 3.19zM14.28 5.4c.59-.72 1-1.71.89-2.71-.86.03-1.9.57-2.51 1.29-.55.63-1.03 1.65-.9 2.62.96.07 1.94-.49 2.52-1.2z"/></svg>

    <span class="footer-brand">Notealise <span class="footer-est">est. 2026</span></span>

  </footer>

  <script>
    // ── Set this to your GitHub "user/repo" once the repo exists. ──────────────
    const REPO = "ReubenCullumHall/Notes-app";
    // Fixed fallback links — match the artifactName in electron-builder.yml, so
    // /releases/latest/download/<name> always points at the newest build.
    const FALLBACK = {
      win: `https://github.com/${REPO}/releases/latest/download/Notealise-Setup.exe`,
      mac: `https://github.com/${REPO}/releases/latest/download/Notealise.dmg`,
    };

    const winBtn = document.getElementById("winBtn");
    const macBtn = document.getElementById("macBtn");
    const notConfigured = REPO === "OWNER/REPO";

    if (notConfigured) document.getElementById("configWarn").classList.remove("hidden");

    // Highlight the button matching the visitor's OS.
    const ua = (navigator.userAgentData?.platform || navigator.platform || navigator.userAgent || "").toLowerCase();
    const isMac = /mac/.test(ua);
    (isMac ? macBtn : winBtn).classList.add("primary");

    // Start with the stable fallback links, then upgrade to the exact asset URLs
    // from the latest Release if the API is reachable.
    winBtn.href = FALLBACK.win;
    macBtn.href = FALLBACK.mac;

    async function loadLatest() {
      if (notConfigured) return;
      try {
        const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`, {
          headers: { Accept: "application/vnd.github+json" },
        });
        if (!r.ok) throw new Error(r.status);
        const rel = await r.json();
        const find = (ext) => rel.assets?.find((a) => a.name.toLowerCase().endsWith(ext));
        const exe = find(".exe"), dmg = find(".dmg");
        if (exe) winBtn.href = exe.browser_download_url;
        if (dmg) macBtn.href = dmg.browser_download_url;
        winBtn.setAttribute("aria-disabled", String(!exe));
        macBtn.setAttribute("aria-disabled", String(!dmg));
      } catch {
        // keep the fallback links working
      }
    }
    loadLatest();
  </script>
